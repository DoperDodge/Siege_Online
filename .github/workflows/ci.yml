name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Pinned: ubuntu-latest became 26.04, where Playwright 1.56 can't install Chromium (CI run 41286991148).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: builds/e2e/
